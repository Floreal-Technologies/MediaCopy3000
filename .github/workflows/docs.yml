name: Check the manual builds

on:
  pull_request:
    paths: ['manual/**', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['manual/**', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          DOCS_BASE: /mediacopy3000/
