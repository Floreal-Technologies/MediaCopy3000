  - {name: GI.GLib.timeoutAddSecondsFull, within: [], message: "Use postAfter or debounced from Floreal.Commons.GLib.MainLoop, or everyOnBehalf from Floreal.Commons.Gtk.Signal"}
  - {name: GI.GLib.idleAdd, within: [], message: "Use postMain or postIdle from Floreal.Commons.GLib.MainLoop"}
  - {name: GI.GLib.idleAddFull, within: [], message: "Use postMain or postIdle from Floreal.Commons.GLib.MainLoop"}
  - {name: GI.GLib.Functions.timeoutAdd, within: [], message: "Use postAfter or debounced from Floreal.Commons.GLib.MainLoop, or everyOnBehalf from Floreal.Commons.Gtk.Signal"}
  - {name: GI.GLib.Functions.timeoutAddFull, within: [], message: "Use postAfter or debounced from Floreal.Commons.GLib.MainLoop, or everyOnBehalf from Floreal.Commons.Gtk.Signal"}
